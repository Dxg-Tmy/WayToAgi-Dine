<svg viewBox="0 0 980 540" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" role="img">
<title>纸壳下料展开图</title>
<desc>用一张瓦楞纸壳裁剪折叠成方盒：底板、围板（前面露三键、背面出 USB）、红顶品牌盖</desc>
<rect width="980" height="540" fill="#fafbfc"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#222">纸壳下料展开图（净尺寸 mm）</text>
<text x="24" y="54" font-size="12" fill="#777">瓦楞纸壳 · 热熔胶点焊 · 实线裁切，红色虚线折叠</text>

<rect x="40" y="80" width="180" height="160" fill="#f3d9d6" stroke="#DA291C" stroke-width="2"/>
<text x="130" y="158" font-size="13" font-weight="700" fill="#DA291C" text-anchor="middle">顶盖（红顶品牌盖）</text>
<text x="130" y="180" font-size="10" fill="#a33" text-anchor="middle">涂红 + 贴黄拱铭牌</text>

<rect x="40" y="300" width="180" height="160" fill="#e9dcc4" stroke="#a8824a" stroke-width="2"/>
<text x="130" y="385" font-size="13" font-weight="700" fill="#6b5530" text-anchor="middle">底板</text>

<rect x="260" y="120" width="680" height="210" fill="#ecdcbf" stroke="#a8824a" stroke-width="2"/>
<line x1="440" y1="120" x2="440" y2="330" stroke="#c0211a" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="600" y1="120" x2="600" y2="330" stroke="#c0211a" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="780" y1="120" x2="780" y2="330" stroke="#c0211a" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="350" y="150" font-size="12" font-weight="700" fill="#6b5530" text-anchor="middle">前面（露 3 键）</text>
<text x="520" y="150" font-size="12" font-weight="700" fill="#6b5530" text-anchor="middle">右侧</text>
<text x="690" y="150" font-size="12" font-weight="700" fill="#6b5530" text-anchor="middle">背面（USB 槽）</text>
<text x="860" y="150" font-size="12" font-weight="700" fill="#6b5530" text-anchor="middle">左侧</text>

<circle cx="290" cy="232" r="22" fill="#fff" stroke="#DA291C" stroke-width="2"/>
<circle cx="350" cy="232" r="22" fill="#fff" stroke="#DA291C" stroke-width="2"/>
<circle cx="410" cy="232" r="22" fill="#fff" stroke="#DA291C" stroke-width="2"/>
<rect x="682" y="202" width="16" height="60" rx="3" fill="#fff" stroke="#222" stroke-width="2"/>

<rect x="40" y="470" width="900" height="56" rx="8" fill="#eef3f8" stroke="#b9c7d6"/>
<text x="56" y="492" font-size="12" font-weight="700" fill="#245">组装顺序</text>
<text x="56" y="512" font-size="11" fill="#334">① 底板 + 围板用热熔胶点焊成盒　② 主板平铺盒底、导线走底槽　③ 前面开 3 孔装按钮帽　④ 背面开槽出 USB　⑤ 顶盖涂红 + 贴黄拱铭牌　⑥ 整机点胶加固</text>
</svg>
